name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU only)
        run: pip install -r requirements.txt
      - name: Recompute every decision and number of paper G3 from the records
        run: python verify/verify_all.py
